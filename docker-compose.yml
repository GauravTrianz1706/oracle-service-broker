version: "3.8"

services:
  oracle-service-broker:
    image: oracle-service-broker:latest
    container_name: oracle-service-broker
    ports:
      - "8080:8080"
    environment:
      - SPRING_PROFILES_ACTIVE=docker
      - TZ=UTC
      - JAVA_OPTS=-Xmx512m -Xms256m -XX:+UseContainerSupport -XX:MaxRAMPercentage=75.0
      - SPRING_DATASOURCE_URL=${SPRING_DATASOURCE_URL:-jdbc:postgresql://postgres:5432/oracle_service_broker}
      - SPRING_DATASOURCE_USERNAME=${SPRING_DATASOURCE_USERNAME:-postgres}
      - SPRING_DATASOURCE_PASSWORD=${SPRING_DATASOURCE_PASSWORD:-postgres}
      - SPRING_DATASOURCE_DRIVER_CLASS_NAME=org.postgresql.Driver
      - SPRING_JPA_DATABASE_PLATFORM=org.hibernate.dialect.PostgreSQLDialect
      - SPRING_JPA_HIBERNATE_DDL_AUTO=${SPRING_JPA_HIBERNATE_DDL_AUTO:-update}
      - SECURITY_USER_NAME=${SECURITY_USER_NAME:-user}
      - SECURITY_USER_PASSWORD=${SECURITY_USER_PASSWORD:-password}
      - MANAGEMENT_SECURITY_ENABLED=false
    volumes:
      - ./config:/app/config
    restart: unless-stopped
    networks:
      - app-network

networks:
  app-network:
    driver: bridge
