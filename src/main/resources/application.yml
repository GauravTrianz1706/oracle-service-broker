spring:
  application:
    name: cf-oracle-service-broker
  datasource:
    url: jdbc:postgresql://localhost:5432/oracle_service_broker
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    database-platform: org.hibernate.dialect.PostgreSQLDialect
security:
  user:
    name: user
    password: password
management:
  security:
    enabled: false
  endpoints:
    health:
      sensitive: false
